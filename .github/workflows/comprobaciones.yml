# Las comprobaciones que definen «validado». Están escritas una sola vez y las llaman la
# pull request (ci-pr.yml) y la entrega desde main (entrega-main.yml).
# Seis jobs en paralelo: cada uno es un check con su propio semáforo en la PR, y el más
# lento marca el tiempo total (alrededor de un minuto).
name: Comprobaciones

on:
  workflow_call:
    secrets:
      OPENROUTER_API_KEY:
        description: "Opcional. Sin él, la evaluación mide las reglas de la demo (gratis)."
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash # con «shell: bash», GitHub ejecuta con -e y -o pipefail

jobs:
  # 1 · Lo más barato primero: dependencias bloqueadas, estilo y errores evidentes.
  calidad:
    name: Calidad
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Las acciones externas van fijadas al SHA completo del commit (40 caracteres).
      # El comentario indica la versión; un tag como @v7 puede moverse, un SHA no.
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: Instalar las dependencias bloqueadas
        run: |
          # --locked falla si uv.lock no corresponde a pyproject.toml: nadie instala «lo último».
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: El lock de Docker sale del mismo lock
        run: |
          uv export --locked --no-dev --no-emit-project --no-header --format requirements-txt \
            | diff -u requirements.lock -

      - name: Análisis de código (ruff)
        # --output-format=github convierte cada problema en una anotación sobre la línea de la PR.
        run: ruff check --output-format=github .

      - name: Formato (ruff format)
        run: ruff format --check --diff .

  # 2 · Tests sin red ni claves, con una cobertura mínima.
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: Tests y cobertura
        run: |
          uv sync --locked
          uv run pytest --cov --cov-report=term-missing --cov-fail-under=90

      - name: Cobertura en el resumen
        if: ${{ !cancelled() }}
        run: |
          { echo "### Cobertura"; echo; uv run coverage report --format=markdown; } \
            >> "$GITHUB_STEP_SUMMARY"

  # 3 · Calidad de la IA: un conjunto fijo de incidencias con su respuesta esperada.
  evaluacion:
    name: Evaluación
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: Evaluar el clasificador (mínimo 80 % de aciertos)
        env:
          # Vacío en las PR desde un fork y mientras no se configure: se evalúan las reglas.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          uv sync --locked
          uv run python -m evaluacion.evaluar --umbral 0.8

  # 4 · El artefacto: se construye la imagen y se prueba el contenedor, no solo el código.
  imagen:
    name: Imagen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Construir la imagen (no se publica)
        run: |
          docker build --provenance=false --build-arg "APP_VERSION=$GITHUB_SHA" \
            -t api:comprobacion .

      - name: Arrancar el contenedor endurecido y probarlo
        run: |
          docker run --rm -d --name api --read-only --cap-drop ALL \
            -p 127.0.0.1:8000:8000 api:comprobacion
          bash scripts/smoke.sh http://127.0.0.1:8000 "$GITHUB_SHA"

      - name: Logs del contenedor
        if: ${{ !cancelled() }}
        run: |
          docker logs api || true
          docker stop api || true

  # 5 · Cadena de suministro: dependencias nuevas o vulnerables.
  dependencias:
    name: Dependencias
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Compara las dependencias de la rama con las de main (grafo de dependencias de GitHub)
      # y falla si la PR introduce una con vulnerabilidad moderada o peor.
      - name: Revisión de dependencias de la PR
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

      - name: Instalar uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      # Lo que va dentro de la imagen, contra la base de vulnerabilidades de PyPI/OSV.
      - name: Vulnerabilidades conocidas (pip-audit)
        run: |
          uvx pip-audit==2.10.1 --requirement requirements.lock --require-hashes \
            --disable-pip --progress-spinner off

  # 6 · El pipeline también es código: los workflows y los scripts se revisan.
  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: Sintaxis y expresiones (actionlint + shellcheck)
        run: uvx --from actionlint-py==1.7.12.24 actionlint -color

      - name: Seguridad de los workflows (zizmor)
        env:
          GH_TOKEN: ${{ github.token }} # algunas auditorías consultan la API de GitHub
        run: uvx zizmor==1.33.1 --format=github .github/workflows

      - name: Scripts de Bash (shellcheck)
        run: shellcheck scripts/*.sh
