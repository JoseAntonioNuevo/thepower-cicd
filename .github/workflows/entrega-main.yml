# Entrega continua desde main. Cada integración recorre el mismo camino:
#   comprobaciones → publicar (una imagen, un digest) → staging → producción (con aprobación)
# Se construye UNA vez: staging y producción usan exactamente el digest publicado.
#
# Todo es nativo de GitHub y gratuito en un repositorio público: la imagen va a GHCR, los
# entornos y la aprobación son environments y cada versión de producción es una release.
# GitHub no aloja la API: «staging» arranca la imagen publicada en el runner y la prueba, y
# «producción» es la etiqueta `produccion` de la imagen (lo que ejecutaría el servidor).
# En AWS, estos dos jobs desplegarían en ECS y probarían su URL; el resto no cambia.
name: Entrega · main

on:
  push:
    branches: [main]
    # Solo hay versión nueva cuando cambia lo que va dentro de la imagen. Los cambios de
    # tests, workflows o documentación ya los validó la PR y no alteran el artefacto.
    paths:
      - app.py
      - requirements.lock
      - Dockerfile
      - .dockerignore

permissions: {}

# Una entrega cada vez y en orden. El rollback comparte el grupo: nunca se pisan.
concurrency:
  group: produccion
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  comprobaciones:
    uses: ./.github/workflows/comprobaciones.yml
    permissions:
      contents: read
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  publicar:
    name: Publicar imagen
    needs: comprobaciones
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # subir la imagen a GHCR con el token del job: no hay claves guardadas
      id-token: write # token OIDC de corta duración para firmar la atestación
      attestations: write # guardar la atestación en GitHub
    outputs:
      imagen: ${{ steps.nombre.outputs.imagen }}
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Nombre de la imagen
        id: nombre
        run: echo "imagen=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT" # GHCR exige minúsculas

      - name: Iniciar sesión en GHCR con el token del job
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # Si se relanza la entrega de un commit ya publicado, se reutiliza su imagen.
      - name: Comprobar si este commit ya está publicado
        id: previo
        env:
          IMAGEN: ${{ steps.nombre.outputs.imagen }}
        run: |
          if docker buildx imagetools inspect "$IMAGEN:$GITHUB_SHA" >/dev/null 2>&1; then
            echo "El commit ya estaba publicado: se reutiliza su imagen."
            echo "existe=si" >> "$GITHUB_OUTPUT"
          else
            echo "existe=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Construir la imagen
        if: steps.previo.outputs.existe == 'no'
        env:
          IMAGEN: ${{ steps.nombre.outputs.imagen }}
        run: |
          # La etiqueta «source» enlaza el paquete con este repositorio y hereda sus permisos.
          # --provenance=false publica un único manifiesto: un artefacto, un digest.
          docker build --provenance=false \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.description=S18 · API de soporte (demo de clase)" \
            --build-arg "APP_VERSION=$GITHUB_SHA" -t "$IMAGEN:$GITHUB_SHA" .

      - name: Probar exactamente la imagen que se va a publicar
        if: steps.previo.outputs.existe == 'no'
        env:
          IMAGEN: ${{ steps.nombre.outputs.imagen }}
        run: |
          docker run --rm -d --name api --read-only --cap-drop ALL \
            -p 127.0.0.1:8000:8000 "$IMAGEN:$GITHUB_SHA"
          bash scripts/smoke.sh http://127.0.0.1:8000 "$GITHUB_SHA"
          docker stop api

      - name: Publicar en GHCR
        if: steps.previo.outputs.existe == 'no'
        env:
          IMAGEN: ${{ steps.nombre.outputs.imagen }}
        run: docker push "$IMAGEN:$GITHUB_SHA"

      # El digest lo calcula el registro a partir del contenido: es la identidad que usan
      # staging, producción y el rollback.
      - name: Leer el digest
        id: digest
        env:
          IMAGEN: ${{ steps.nombre.outputs.imagen }}
        run: |
          DIGEST="$(docker buildx imagetools inspect "$IMAGEN:$GITHUB_SHA" \
            --format '{{json .Manifest}}' | jq -r '.digest')"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::GHCR no devolvió un digest"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Digest publicado: $DIGEST"

      # Atestación de procedencia firmada: qué repositorio, commit y workflow construyeron
      # este digest. Cualquiera puede comprobarla con «gh attestation verify».
      - name: Atestación de procedencia
        if: steps.previo.outputs.existe == 'no'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.nombre.outputs.imagen }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Resumen
        env:
          IMAGEN: ${{ steps.nombre.outputs.imagen }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          {
            echo "### Imagen publicada"
            echo ""
            echo "| Dato | Valor |"
            echo "|---|---|"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Imagen | \`$IMAGEN:$GITHUB_SHA\` |"
            echo "| **Digest** | \`$DIGEST\` |"
            echo ""
            echo "Comprobar la procedencia: \`gh attestation verify oci://$IMAGEN@$DIGEST --repo $GITHUB_REPOSITORY\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cerrar la sesión de Docker
        if: always()
        run: docker logout ghcr.io

  staging:
    name: Staging
    needs: publicar
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # El environment deja registro de cada despliegue y solo admite la rama main.
    environment: staging
    permissions:
      contents: read
      packages: read
    env:
      IMAGEN: ${{ needs.publicar.outputs.imagen }}
      DIGEST: ${{ needs.publicar.outputs.digest }}
    steps:
      - name: Descargar el código (solo para usar scripts/smoke.sh)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Iniciar sesión en GHCR
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Desplegar en staging la imagen publicada, por digest
        run: |
          # Nada se reconstruye: se descarga del registro exactamente el digest publicado.
          docker pull "$IMAGEN@$DIGEST"
          docker run --rm -d --name api --read-only --cap-drop ALL \
            -p 127.0.0.1:8000:8000 "$IMAGEN@$DIGEST"

      - name: Comprobar staging (smoke)
        # Un job en verde no basta: la API tiene que responder y con la versión esperada.
        run: bash scripts/smoke.sh http://127.0.0.1:8000 "$GITHUB_SHA"

      - name: Logs de staging
        if: ${{ !cancelled() }}
        run: |
          docker logs api || true
          docker stop api || true

      - name: Resumen
        run: |
          {
            echo "### Staging · correcto"
            echo ""
            echo "Imagen \`$IMAGEN@$DIGEST\` (commit \`${GITHUB_SHA:0:7}\`): salud, versión,"
            echo "una clasificación y una entrada inválida rechazada con 422."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cerrar la sesión de Docker
        if: always()
        run: docker logout ghcr.io

  produccion:
    name: Producción
    needs: [publicar, staging]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # El environment «produccion» exige la aprobación de una persona antes de empezar.
    environment:
      name: produccion
      url: ${{ steps.release.outputs.url }}
    permissions:
      contents: write # crear la release y su etiqueta de git
      packages: write # mover la etiqueta «produccion» de la imagen
    env:
      IMAGEN: ${{ needs.publicar.outputs.imagen }}
      DIGEST: ${{ needs.publicar.outputs.digest }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Iniciar sesión en GHCR
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Calcular la versión
        id: version
        run: |
          # Si este commit ya tiene release (se relanzó el job), se reutiliza su versión.
          VERSION="$(gh api "repos/$GH_REPO/releases?per_page=50" \
            --jq '[.[] | select(.target_commitish == env.GITHUB_SHA)][0].tag_name // empty')"
          if [[ -z "$VERSION" ]]; then
            ULTIMA="$(gh release list --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName // empty')"
            if [[ -z "$ULTIMA" ]]; then
              VERSION=v1.0.0
            elif [[ "$ULTIMA" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              VERSION="v${BASH_REMATCH[1]}.$((BASH_REMATCH[2] + 1)).0"
            else
              echo "::error::La última release tiene una etiqueta inesperada: $ULTIMA"
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión: $VERSION"

      - name: Leer lo que hay ahora en producción
        id: antes
        run: |
          ANTES="$(docker buildx imagetools inspect "$IMAGEN:produccion" \
            --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty' || true)"
          echo "digest=$ANTES" >> "$GITHUB_OUTPUT"

      # Promocionar no es reconstruir: la etiqueta pasa a señalar el mismo digest que se probó.
      # --prefer-index=false copia el manifiesto tal cual, así que el digest no cambia.
      - name: Mover «produccion» a este digest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx imagetools create --prefer-index=false \
            --tag "$IMAGEN:produccion" --tag "$IMAGEN:$VERSION" "$IMAGEN@$DIGEST"
          AHORA="$(docker buildx imagetools inspect "$IMAGEN:produccion" \
            --format '{{json .Manifest}}' | jq -r '.digest')"
          [[ "$AHORA" == "$DIGEST" ]] || { echo "::error::produccion señala $AHORA y no $DIGEST"; exit 1; }

      - name: Crear la release
        id: release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            {
              echo "**Imagen:** \`$IMAGEN@$DIGEST\`"
              echo ""
              echo "**Commit:** \`$GITHUB_SHA\`"
              echo ""
              echo "- Comprobar la procedencia: \`gh attestation verify oci://$IMAGEN@$DIGEST --repo $GH_REPO\`"
              echo "- Volver a esta versión: Actions → «Rollback · producción» → \`$VERSION\`"
              echo ""
            } > notas.md
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" \
              --notes-file notas.md --generate-notes
          fi
          echo "url=$(gh release view "$VERSION" --json url --jq .url)" >> "$GITHUB_OUTPUT"

      - name: Resumen
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ANTES: ${{ steps.antes.outputs.digest }}
        run: |
          {
            echo "### Producción · $VERSION"
            echo ""
            echo "| | Antes | Después |"
            echo "|---|---|---|"
            echo "| Digest | \`${ANTES:-nada}\` | \`$DIGEST\` |"
            echo ""
            echo "**Para volver atrás:** Actions → «Rollback · producción» con la versión anterior."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cerrar la sesión de Docker
        if: always()
        run: docker logout ghcr.io

  panel:
    needs: produccion
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/panel.yml
    permissions:
      contents: read
      packages: read
      issues: read
      actions: read
      pages: write
      id-token: write
